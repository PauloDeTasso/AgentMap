<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentMap - Monitoramento</title>
  <meta name="theme-color" content="#1e1e1e">
  <link rel="stylesheet" href="css/monitoramento.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header__container">
      <h1 class="header__titulo">AgentMap - Monitoramento de Agentes</h1>
      <div class="header__status" id="status-ws">🔴 WebSocket Desconectado</div>
    </div>
  </header>

  <nav class="nav" id="nav-modo">
    <div class="nav__container">
      <span class="nav__projeto-ativo" id="nome-projeto-ativo">PAGINA PESSOAL</span>
      <div class="modo-toggle">
        <span>Modo: </span>
        <button class="modo-btn" data-modo="AUTOMATICO" id="btn-modo-auto">AUTOMÁTICO</button>
        <button class="modo-btn" data-modo="HIBRIDO" id="btn-modo-hibrido">HÍBRIDO</button>
        <button class="modo-btn" data-modo="MANUAL" id="btn-modo-manual">MANUAL</button>
      </div>
      <button class="nav__btn nav__btn--ghost" id="btn-pausar-auto">Pausar Auto-scroll</button>
    </div>
  </nav>

  <main class="main">
    <div class="monitor-container">
      <aside class="agentes-sidebar" id="agentes-sidebar">
        <div class="agentes-header">
          <h2>Agentes</h2>
          <span class="agentes-count" id="agentes-count">0 agentes</span>
          <button class="agentes-clear" id="btn-limpar-agentes" title="Remover todos os agentes">🗑️</button>
        </div>
        <div class="agentes-list" id="agentes-list">
        </div>
      </aside>

      <aside class="kilo-sidebar" id="kilo-sidebar">
        <div class="agentes-header">
          <h2>Kilo</h2>
          <span class="agentes-count" id="kilo-count">0 worktrees</span>
        </div>
        <div class="agentes-list" id="kilo-list">
        </div>
      </aside>

      <aside class="alertas-sidebar" id="alertas-sidebar">
        <div class="agentes-header">
          <h2>Alertas</h2>
          <span class="agentes-count" id="alertas-count">0 alertas</span>
          <button class="btn-add-item" id="btn-add-alerta" title="Adicionar alerta">+</button>
          <button class="btn-configure" id="btn-config-monitor" title="Configurações">⚙️</button>
        </div>
        <div class="agentes-list" id="alertas-list">
        </div>
      </aside>

      <aside class="regras-sidebar" id="regras-sidebar">
        <div class="agentes-header">
          <h2>Regras</h2>
          <span class="agentes-count" id="regras-count">0 regras</span>
          <button class="btn-add-item" id="btn-add-regra" title="Adicionar regra">+</button>
        </div>
        <div class="agentes-list" id="regras-list">
        </div>
      </aside>

      <section class="chat-section">
        <div class="chat-header">
          <h2>Chat / Monitoramento</h2>
          <div class="chat-filtros">
            <select id="filtro-agente" class="filtro-select">
              <option value="todos">Todos os agentes</option>
            </select>
            <select id="filtro-tipo" class="filtro-select">
              <option value="todos">Todos os tipos</option>
            </select>
            <button class="chat-clear" id="btn-limpar-todas" title="Apagar todas as mensagens">🗑️ Limpar</button>
            <button class="chat-clear" id="btn-limpar-mensagens" title="Limpar mensagens">Limpar</button>
          </div>
        </div>
        <div class="chat-messages" id="chat-messages">
        </div>
        <div class="chat-input-container">
          <input type="text" id="input-mensagem" class="chat-input" placeholder="Digite uma mensagem ou comando..." autocomplete="off">
          <button class="chat-send" id="btn-enviar">Enviar</button>
        </div>
        <button class="scroll-btn" id="btn-scroll">
          <span class="scroll-icon">↓</span>
          <span class="scroll-badge" id="badge-novas">0</span>
        </button>
      </section>
    </div>
  </main>

  <script src="js/monitoramento.js" type="module"></script>

  <div class="modal-overlay" id="modal-alerta" style="display:none;">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modal-alerta-titulo">Novo Alerta</h3>
        <button class="modal-close" data-modal="modal-alerta">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="alerta-nome">Nome *</label>
          <input type="text" id="alerta-nome" placeholder="Nome do alerta">
        </div>
        <div class="form-group">
          <label for="alerta-descricao">Descrição</label>
          <textarea id="alerta-descricao" placeholder="Descrição do alerta"></textarea>
        </div>
        <div class="form-group">
          <label for="alerta-tipo">Tipo *</label>
          <select id="alerta-tipo">
            <option value="LIMIAR">LIMIAR</option>
            <option value="EVENTO">EVENTO</option>
            <option value="CONDICAO">CONDIÇÃO</option>
          </select>
        </div>
        <div class="form-group">
          <label for="alerta-condicao">Condição *</label>
          <input type="text" id="alerta-condicao" placeholder="Ex: progresso < 50">
        </div>
        <div class="form-group">
          <label for="alerta-acao">Ação *</label>
          <input type="text" id="alerta-acao" placeholder="Ex: notificar usuario">
        </div>
        <div class="form-group">
          <label for="alerta-prioridade">Prioridade</label>
          <select id="alerta-prioridade">
            <option value="BAIXA">BAIXA</option>
            <option value="MEDIA">MÉDIA</option>
            <option value="ALTA">ALTA</option>
            <option value="CRITICA">CRÍTICA</option>
          </select>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="alerta-ativo" checked> Ativo
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-modal="modal-alerta">Cancelar</button>
        <button class="btn btn-primary" id="btn-salvar-alerta">Salvar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-regra" style="display:none;">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modal-regra-titulo">Nova Regra</h3>
        <button class="modal-close" data-modal="modal-regra">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="regra-nome">Nome *</label>
          <input type="text" id="regra-nome" placeholder="Nome da regra">
        </div>
        <div class="form-group">
          <label for="regra-descricao">Descrição</label>
          <textarea id="regra-descricao" placeholder="Descrição da regra"></textarea>
        </div>
        <div class="form-group">
          <label for="regra-gatilho">Gatilho *</label>
          <input type="text" id="regra-gatilho" placeholder="Ex: tarefa_concluida">
        </div>
        <div class="form-group">
          <label for="regra-acao">Ação *</label>
          <input type="text" id="regra-acao" placeholder="Ex: iniciar_proxima_tarefa">
        </div>
        <div class="form-group">
          <label for="regra-parametros">Parâmetros (JSON)</label>
          <textarea id="regra-parametros" placeholder='{"chave": "valor"}'></textarea>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="regra-ativo" checked> Ativo
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-modal="modal-regra">Cancelar</button>
        <button class="btn btn-primary" id="btn-salvar-regra">Salvar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-config" style="display:none;">
    <div class="modal-container">
      <div class="modal-header">
        <h3>Configurações de Monitoramento</h3>
        <button class="modal-close" data-modal="modal-config">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="config-timeout">Timeout Heartbeat (ms)</label>
          <input type="number" id="config-timeout" placeholder="300000">
        </div>
        <div class="form-group">
          <label for="config-modo">Modo Global</label>
          <select id="config-modo">
            <option value="MANUAL">MANUAL</option>
            <option value="HIBRIDO">HÍBRIDO</option>
            <option value="AUTOMATICO">AUTOMÁTICO</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-modal="modal-config">Cancelar</button>
        <button class="btn btn-primary" id="btn-salvar-config">Salvar</button>
      </div>
    </div>
  </div>
</body>
</html>
